# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.19.5
    - java@13.0.11
    - node@18.12.1
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - trufflehog-git@3.40.0
    - actionlint@1.6.9
    - bandit@1.9.4
    - black@26.3.1
    - checkov@3.2.526
    - clippy@1.65.0
    - git-diff-check
    - gofmt@1.20.4
    - gokart@0.5.1
    - golangci-lint@1.46.2
    - hadolint@2.10.0
    - isort@8.0.1
    - ktlint@0.43.2
    - markdownlint@0.48.0
    - osv-scanner@1.3.6
    - oxipng@7.0.0
    - prettier@3.8.3
    - ruff@0.15.12
    - rustfmt@1.65.0
    - shellcheck@0.8.0
    - shfmt@3.6.0
    - svgo@4.0.1
    - taplo@0.8.0
    - terrascan@1.18.1
    - trivy@0.37.1
    - trufflehog@3.31.3
    - yamllint@1.38.0
actions:
  enabled:
    - trufflehog-pre-commit
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
